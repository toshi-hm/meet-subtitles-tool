<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meet Subtitles 設定</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }
      body {
        width: 340px;
        margin: 0;
        color: #172033;
        background: #fff;
      }
      main {
        display: grid;
        gap: 14px;
        padding: 18px;
      }
      h1 {
        margin: 0;
        color: #000048;
        font-size: 18px;
      }
      p {
        margin: 0;
        font-size: 12px;
        line-height: 1.6;
      }
      .links {
        display: grid;
        gap: 4px;
      }
      a {
        color: #1d4ed8;
        font-size: 12px;
      }
      code {
        overflow-wrap: anywhere;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Meet Subtitles 設定</h1>
      <p>
        Google Drive保存は、ChromeにログインしているGoogleアカウントで認証します。OAuth Client
        IDやClient Secretの入力は不要です。
      </p>
      <div class="links">
        <p>初回はMeetのパネルにある<code>Drive接続</code>を押してください。</p>
        <p>Googleの認証画面で、Driveへのファイル作成を許可すると保存を利用できます。</p>
        <p>Google Drive保存はGoogle Chromeでのみ利用できます。</p>
        <a
          href="https://console.cloud.google.com/apis/library/drive.googleapis.com"
          target="_blank"
          rel="noreferrer"
          >Google Drive APIを有効化</a
        >
        <a
          href="https://console.cloud.google.com/apis/credentials/consent"
          target="_blank"
          rel="noreferrer"
          >OAuth同意画面を設定</a
        >
      </div>
    </main>
  </body>
</html>
