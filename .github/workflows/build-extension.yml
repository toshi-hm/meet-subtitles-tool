name: Build extension

on:
  push:
    branches: [main]
    paths-ignore:
      - "extension/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-extension
  cancel-in-progress: false

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Chrome MV3 extension
        run: bun run build

      - name: Copy unpacked extension
        run: |
          rm -rf extension
          mkdir -p extension
          cp -R .output/chrome-mv3/. extension/

      - name: Commit generated extension
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A extension
          if git diff --cached --quiet; then
            echo "extension directory is already up to date"
          else
            git commit -m "Build: Chrome拡張機能の配布用成果物を更新"
            git push origin HEAD:main
          fi
