name: Lint and format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript and JavaScript lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Check Markdown
        run: bun run lint:md
