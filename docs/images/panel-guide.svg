<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Meet Subtitlesパネルの操作イメージ</title>
  <desc id="desc">Google Meet画面の上に字幕取得状態とコピー、TXT保存、Drive保存ボタンを持つフローティングパネルが表示されている</desc>
  <rect width="1200" height="720" rx="28" fill="#e2e8f0"/>
  <rect x="38" y="38" width="1124" height="644" rx="22" fill="#334155"/>
  <rect x="70" y="70" width="1060" height="64" rx="14" fill="#475569"/>
  <circle cx="105" cy="102" r="14" fill="#ef4444"/><circle cx="147" cy="102" r="14" fill="#f59e0b"/><circle cx="189" cy="102" r="14" fill="#22c55e"/>
  <rect x="250" y="89" width="420" height="27" rx="13" fill="#64748b"/>
  <rect x="70" y="162" width="660" height="480" rx="18" fill="#1e293b"/>
  <circle cx="410" cy="350" r="130" fill="#64748b" opacity=".7"/><circle cx="410" cy="310" r="48" fill="#cbd5e1"/><path d="M320 485c20-84 160-84 180 0" fill="#cbd5e1"/>
  <rect x="180" y="548" width="460" height="45" rx="12" fill="#0f172a"/><text x="204" y="578" fill="#fff" font-family="sans-serif" font-size="20">字幕: 発話内容がここに表示されます</text>
  <g font-family="sans-serif">
    <rect x="766" y="178" width="330" height="280" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="766" y="178" width="330" height="58" rx="18" fill="#f8fafc"/>
    <text x="790" y="214" fill="#172033" font-size="21" font-weight="700">Meet Subtitles</text>
    <text x="1014" y="213" fill="#475569" font-size="16">12件</text>
    <circle cx="790" cy="270" r="7" fill="#16a34a"/><text x="808" y="277" fill="#475569" font-size="17">字幕取得中</text>
    <rect x="786" y="302" width="88" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="810" y="327" fill="#1e293b" font-size="15">コピー</text>
    <rect x="884" y="302" width="88" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="905" y="327" fill="#1e293b" font-size="15">TXT保存</text>
    <rect x="982" y="302" width="92" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="995" y="327" fill="#1d4ed8" font-size="15">Drive保存</text>
    <text x="786" y="390" fill="#2563eb" font-size="15">必要な時点でいつでも保存</text>
    <text x="786" y="420" fill="#64748b" font-size="14">ヘッダーをドラッグして移動</text>
  </g>
</svg>
